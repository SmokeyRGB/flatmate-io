name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # G-A1 (docs/GUARDRAILS.md): secret-scanning as a CI gate — the enforceable half; the pre-commit
  # hook (.husky/pre-commit) is local-only and can be skipped (uninstalled binary, --no-verify).
  # Uses the official gitleaks Docker image directly rather than gitleaks/gitleaks-action: v2 is
  # being removed with GitHub's Node 20 runner deprecation (2026-09-16), and v3's org-account
  # licensing doesn't apply to the plain open-source CLI this image ships.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — gitleaks scans commits, not just the working tree

      # Pinned to a released version, not :latest — a future image update must not be able to
      # change scan rules/behavior without a deliberate bump of this line. Bump by editing the
      # tag after checking https://github.com/gitleaks/gitleaks/releases.
      - name: Gitleaks scan
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: detect --redact --verbose

  # Runs the full suite against a disposable Supabase stack inside the runner — no repository
  # secret, no connection to flatmate-io-dev or production (openspec/changes/ci-local-database,
  # design.md D5). This is an experiment: see that change's proposal for the go/no-go gate.
  verify:
    runs-on: ubuntu-24.04 # pinned (not ubuntu-latest) for its psql 16 client (design.md Context)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Runs first and needs no secrets: catches compile/type errors fast, per
      # docs/GUARDRAILS.md's Minimal-Gate item 2 (TypeScript strict).
      - run: npm run build

      - uses: supabase/setup-cli@v3
        with:
          version: 2.118.0

      # The CLI reads its Postgres/GoTrue image pins from supabase/.temp/, a mechanism internal to
      # the CLI (design.md D2) — supabase/pins/*-version are the committed source of truth, copied
      # here so a pin bump is a deliberate edit to those files, never a side effect of a CLI
      # release moving its own defaults.
      - name: Copy version pins into supabase/.temp
        run: |
          mkdir -p supabase/.temp
          cp supabase/pins/postgres-version supabase/.temp/postgres-version
          cp supabase/pins/gotrue-version supabase/.temp/gotrue-version

      # Only the services the suite uses (design.md D1): Auth, the Kong gateway in front of it and
      # PostgREST, Postgres itself, and the transaction-mode pooler. No Storage, Realtime or Edge
      # Functions.
      - name: Start the local Supabase stack
        run: |
          start=$(date +%s)
          supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,mailpit
          end=$(date +%s)
          echo "STACK_STARTUP_SECONDS=$((end - start))" >> "$GITHUB_ENV"

      # Builds the schema from scripts/db/bootstrap-roles.sql + drizzle/ only (G-E3), asserts the
      # running images match the committed pins, proves the pooler path (decision 4), proves
      # PostgREST sees the schema, and exports DATABASE_URL/the Supabase env vars this run's
      # suite reads. Reads no repository secret; every password it creates is generated for this
      # run only.
      - name: Bootstrap the local database
        run: ./scripts/ci/bootstrap-local-db.sh

      - name: npm run verify
        run: |
          start=$(date +%s)
          npm run verify
          end=$(date +%s)
          echo "VERIFY_SECONDS=$((end - start))" >> "$GITHUB_ENV"

      - name: Record timing
        if: always()
        run: |
          {
            echo "### CI timing"
            echo "- stack start-up: ${STACK_STARTUP_SECONDS:-n/a}s"
            echo "- npm run verify: ${VERIFY_SECONDS:-n/a}s"
          } >> "$GITHUB_STEP_SUMMARY"

      # Cross-reference check. Runs on plain `node` — Node 24 strips the types natively, so the
      # docs/ + tools/ handover package needs no TypeScript toolchain to validate itself.
      # `npm run verify` above already runs this; kept here as the explicit non-quiet gate.
      - run: node tools/check-refs.ts

  # Runs the full suite against hosted flatmate-io-dev, only on push to main, so it never blocks a
  # pull request (human decision 2026-09-26, decision 6). Catches anything a --no-verify push
  # skipped locally, and anything the local stack's pinned versions don't actually reproduce.
  verify-hosted:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    concurrency:
      group: hosted-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Runs first and needs no secrets: catches compile/type errors fast, per
      # docs/GUARDRAILS.md's Minimal-Gate item 2 (TypeScript strict).
      - run: npm run build

      # eslint + the four custom guardrail checks + the full test suite. The integration tests
      # talk to a real Supabase project (transaction-mode pooler) and, since F1, to Supabase
      # Auth's admin API — so this needs DATABASE_URL plus the three Supabase env vars.
      #
      # Since 2026-09-18 this is the **flatmate-io-dev** project, not production. The suite
      # creates real households and Auth users and its cleanup is best-effort, so CI was steadily
      # writing rows into production that nothing could remove (activity_event is append-only).
      # tests/setup.ts now refuses to run if these point back at the production ref.
      - run: npm run verify
        env:
          # Workers for the network-bound test suite; see vitest.config.ts's maxWorkers comment.
          # Trial value (PR #19): the runner's default of 3 left it mostly idle on I/O.
          VITEST_MAX_WORKERS: "8"
          # Must now be the flatmate-io-dev pooler string (app_runtime, port 6543). Update it at
          # Settings > Secrets and variables > Actions; a stale production value makes the run
          # fail fast in tests/setup.ts rather than writing to production.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Project URL and anon/publishable key are not secret — NEXT_PUBLIC_* is meant to ship
          # in the browser bundle, so hardcoding them here (rather than as repo secrets) is
          # correct, not a shortcut. flatmate-io-dev project (jrhkhjeybtkqpkggssif), eu-west-1.
          NEXT_PUBLIC_SUPABASE_URL: "https://jrhkhjeybtkqpkggssif.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpyaGtoamV5YnRrcXBrZ2dzc2lmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3MjI3MTYsImV4cCI6MjEwNTI5ODcxNn0.bu3JShx9rXq2DKy9_W2XHAxsrWb8Ce4Vymx0_oBfREM" # gitleaks:allow — anon key, public by design
          # This one IS a real secret (bypasses RLS entirely) — add it via GitHub: Settings >
          # Secrets and variables > Actions > New repository secret, name
          # SUPABASE_SERVICE_ROLE_KEY. Never hardcode it here the way the two values above are.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # HMAC key for Session.token_hash (src/modules/identity/auth.ts, hashSessionToken) —
          # add via the same Settings > Secrets and variables > Actions path, name
          # SESSION_TOKEN_HASH_SECRET. A random value generated once for CI is fine; it never
          # needs to match any other environment's secret.
          SESSION_TOKEN_HASH_SECRET: ${{ secrets.SESSION_TOKEN_HASH_SECRET }}

      # Cross-reference check. Runs on plain `node` — Node 24 strips the types natively, so the
      # docs/ + tools/ handover package needs no TypeScript toolchain to validate itself.
      # `npm run verify` above already runs this; kept here as the explicit non-quiet gate.
      - run: node tools/check-refs.ts

      # Catches hosted dev drifting past the pins committed in supabase/pins/ (design.md D2). Its
      # limit: server_version only reports major.minor, so a patch-level image move at hosted dev
      # goes unseen here — whoever bumps the pins re-reads the exact image (supabase/pins/README.md).
      - name: Check for pin drift against hosted dev
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Same anon key as verify-hosted's NEXT_PUBLIC_SUPABASE_ANON_KEY above — public by
          # design, not a secret (flatmate-io-dev project jrhkhjeybtkqpkggssif).
          HOSTED_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpyaGtoamV5YnRrcXBrZ2dzc2lmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3MjI3MTYsImV4cCI6MjEwNTI5ODcxNn0.bu3JShx9rXq2DKy9_W2XHAxsrWb8Ce4Vymx0_oBfREM" # gitleaks:allow — anon key, public by design
        run: |
          expected_gotrue="$(cat supabase/pins/gotrue-version)"
          expected_pg_major_minor="$(cut -d. -f1,2 < supabase/pins/postgres-version)"

          actual_gotrue="$(curl -fsS "https://jrhkhjeybtkqpkggssif.supabase.co/auth/v1/health" \
            -H "apikey: $HOSTED_ANON_KEY" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>process.stdout.write(JSON.parse(d).version||""))')"
          actual_pg_server_version="$(psql "$DATABASE_URL" -tAc 'show server_version')"
          actual_pg_major_minor="$(echo "$actual_pg_server_version" | cut -d. -f1,2)"

          fail=0
          if [ "$actual_gotrue" != "$expected_gotrue" ]; then
            echo "Pin drift: hosted dev's Auth version is '$actual_gotrue', supabase/pins/gotrue-version says '$expected_gotrue'. Bump supabase/pins on purpose." >&2
            fail=1
          fi
          if [ "$actual_pg_major_minor" != "$expected_pg_major_minor" ]; then
            echo "Pin drift: hosted dev's Postgres server_version is '$actual_pg_server_version', supabase/pins/postgres-version says '$(cat supabase/pins/postgres-version)' (major.minor '$expected_pg_major_minor'). Bump supabase/pins on purpose." >&2
            fail=1
          fi
          exit "$fail"
