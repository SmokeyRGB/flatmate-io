# Data inventory — ADR-010, docs/domain/personenbezogene-felder.md.
#
# Every column on every table this codebase has created so far is declared here, including ⚙️
# (not personal) columns — ADR-010 requires that explicitly, since an undeclared column silently
# defeats the whole gate ("sonst wird 'nicht deklariert' zu 'unauffällig'").
#
# Categories: 🔴 personenbezogen/Bewerbende · 🟠 personenbezogen/Bewohnende+Accounts ·
# ⚫ Beratungsinhalt (V-1 self-redaction) · ⚙️ not personal data. `category: "⚙️"` is this file's
# spelling of G-F1's `personal_data: false` — the same explicit decision, just a different token.
#
# This file is now enforced: `scripts/lint/data-inventory.ts` (wired into `npm run verify`) fails
# when a schema.ts column has no entry here, when an entry here names a column no schema.ts
# declares, when a category is missing/invalid or a personal-data entry lacks purpose/legal_basis/
# retention, when a table's declared `context` doesn't match the module that defines it, or when a
# name matches the Art.-9 blocklist. `tests/integration/schema/data-inventory-live.test.ts` adds
# the other direction: it fails when the *migrated* database (not just schema.ts) holds a table or
# column this file doesn't declare. Together they check completeness, not correctness — ADR-010:
# "Er prüft Vollständigkeit, nicht Richtigkeit."

tables:
  # --- F0 (src/modules/casting/schema.ts) ---
  application:
    context: casting
    columns:
      id: { category: "⚙️" }
      household_id: { category: "⚙️", purpose: "RLS-Anker (ADR-004)" }
      round_id: { category: "⚙️" }
      state: { category: "⚙️" }
      state_changed_at: { category: "⚙️" }
      became_resident_id: { category: "🟠", purpose: "trägt V-1 (Selbst-Redaktion)", legal_basis: "Art. 6(1)(f) DSGVO", retention: "an Application.retention_until gebunden" }
      created_by_account_id: { category: "🟠", purpose: "Zurechenbarkeit (ADR-004)", legal_basis: "Art. 6(1)(f) DSGVO", retention: "an Application.retention_until gebunden" }
      created_by_profile_id: { category: "🟠", purpose: "Zurechenbarkeit (ADR-004)", legal_basis: "Art. 6(1)(f) DSGVO", retention: "an Application.retention_until gebunden" }
      retention_until: { category: "⚙️" }
      created_at: { category: "⚙️" }
      deleted_at: { category: "⚙️" }
      applicant_name: { category: "🔴", purpose: "Identifikation im Screening (Compliance §6.2)", legal_basis: "Art. 6(1)(b) DSGVO", retention: "180 Tage nach Rundenabschluss (Compliance §5.3)" }
      age: { category: "🔴", purpose: "Passung zur WG-Struktur (Compliance §6.2)", legal_basis: "Art. 6(1)(b) und (f) DSGVO", retention: "180 Tage nach Rundenabschluss (Compliance §5.3)" }
      contact_email: { category: "🔴", purpose: "Einladung, Terminabsprache, Absage; Identitätsnachweis bei Betroffenenanfragen (Compliance §6.2)", legal_basis: "Art. 6(1)(b) DSGVO", retention: "180 Tage nach Rundenabschluss (Compliance §5.3)" }
      contact_phone: { category: "🔴", purpose: "Einladung, Terminabsprache, Absage (Kanalneutralität P-1, Compliance §6.2)", legal_basis: "Art. 6(1)(b) DSGVO", retention: "180 Tage nach Rundenabschluss (Compliance §5.3)" }
      contact_other: { category: "🔴", purpose: "Portal-Handle oder Messenger-Kennung, der Kanal der Bewerbung (P-1, Compliance §6.2)", legal_basis: "Art. 6(1)(b) DSGVO", retention: "180 Tage nach Rundenabschluss (Compliance §5.3)" }
      message_raw: { category: "🔴", purpose: "ursprüngliche Nachricht der Bewerbung; Freitext mit Art.-9-Risiko (C-3.4, Compliance §6.2 und §8)", legal_basis: "Art. 6(1)(b) DSGVO", retention: "180 Tage nach Rundenabschluss (Compliance §5.3)" }
      attributes: { category: "🔴", purpose: "freie Zusatzangaben, von Hand erfasst (Compliance §6.2)", legal_basis: "Art. 6(1)(b) DSGVO", retention: "180 Tage nach Rundenabschluss (Compliance §5.3)" }
      source: { category: "⚙️", purpose: "technischer Erfassungspfad, kein Rechtsgrundlagen-Träger (Compliance §6.2)" }
      collected_from: { category: "⚙️", purpose: "rechtlicher Erhebungsort, trägt die Entscheidung Art. 13 vs. Art. 14 (Compliance §4.4, §6.2)" }

  room:
    context: casting
    columns:
      id: { category: "⚙️" }
      household_id: { category: "⚙️" }
      label: { category: "⚙️" }
      status: { category: "⚙️" }
      current_resident_profile_id: { category: "🟠", purpose: "wer aktuell darin wohnt", legal_basis: "Art. 6(1)(f) DSGVO", retention: "bis Room-Löschung" }
      created_at: { category: "⚙️" }
      deleted_at: { category: "⚙️" }

  casting_round:
    context: casting
    columns:
      id: { category: "⚙️" }
      household_id: { category: "⚙️" }
      title: { category: "⚙️", purpose: "einziges Freitextfeld in der für den Haushalts-Account sichtbaren Hälfte (ADR-014) — bewusst kein Personenbezug erwartet" }
      status: { category: "⚙️" }
      room_ids: { category: "⚙️" }
      settings_snapshot: { category: "⚙️" }
      opened_at: { category: "⚙️" }
      closed_at: { category: "⚙️" }
      phase_deadline_at: { category: "⚙️" }
      quorum_denominator_frozen: { category: "⚙️" }
      retention_until: { category: "⚙️" }
      retention_extensions: { category: "⚙️" }
      retention_warned_at: { category: "⚙️" }
      created_at: { category: "⚙️" }

  round_participation:
    context: casting
    columns:
      id: { category: "⚙️" }
      round_id: { category: "⚙️" }
      household_id: { category: "⚙️" }
      resident_profile_id: { category: "🟠", purpose: "wer an dieser Runde teilnimmt", legal_basis: "Art. 6(1)(f) DSGVO", retention: "an CastingRound.retention_until gebunden" }
      source: { category: "⚙️" }
      can_vote: { category: "⚙️" }
      added_at: { category: "⚙️" }
      removed_at: { category: "⚙️" }

  # --- F0 (src/modules/audit/schema.ts) ---
  activity_event:
    context: audit
    columns:
      id: { category: "⚙️" }
      household_id: { category: "⚙️", purpose: "RLS-Anker" }
      round_id: { category: "⚙️" }
      event_type: { category: "⚙️" }
      subject_type: { category: "⚙️" }
      subject_id: { category: "⚙️" }
      actor_account_id: { category: "🟠", purpose: "Zurechenbarkeit (P-4, ADR-003)", legal_basis: "Art. 6(1)(f) DSGVO", retention: "redigiert am Fristende der referenzierten Application (G-D8)" }
      actor_profile_id: { category: "🟠", purpose: "Zurechenbarkeit (P-4, ADR-003)", legal_basis: "Art. 6(1)(f) DSGVO", retention: "redigiert am Fristende der referenzierten Application (G-D8)" }
      payload: { category: "🟠", purpose: "Referenzen/Zähler je event_type (G-D7) — pauschal 🟠 deklariert, da der Inhalt je nach event_type variiert (ADR-010's jsonb-Hinweis)", legal_basis: "Art. 6(1)(f) DSGVO", retention: "einzelne Schlüssel redigiert am Fristende (G-D8)" }
      occurred_at: { category: "⚙️" }
      correlation_id: { category: "⚙️" }
      reverses_event_id: { category: "⚙️" }

  # --- F1 (src/modules/identity/schema.ts) ---
  account:
    context: identity
    columns:
      id: { category: "⚙️" }
      household_id: { category: "⚙️", purpose: "RLS-Anker (denormalisiert, wie Application.household_id)" }
      email: { category: "🟠", purpose: "Anmeldeadresse; bei Resident-Accounts abgeleitet/nicht zustellbar, bis eine eigene Adresse hinterlegt ist (dann beim Anbieter gespeichert, unbestätigt)", legal_basis: "Art. 6(1)(b) DSGVO (Vertrag)", retention: "bis Account-Löschung" }
      email_verified_at: { category: "🟠", purpose: "Zustellungs-Autorität (identity.md §2.1)", legal_basis: "Art. 6(1)(b) DSGVO", retention: "bis Account-Löschung" }
      password_changed_at: { category: "⚙️", purpose: "Anmeldegeneration: eine vor diesem Zeitpunkt begonnene Anmeldung legt keine Session an (identity.md §2.1)" }
      locale: { category: "⚙️" }
      created_at: { category: "⚙️" }
      deleted_at: { category: "⚙️" }

  session:
    context: identity
    columns:
      id: { category: "⚙️" }
      household_id: { category: "⚙️", purpose: "RLS-Anker (denormalisiert)" }
      token_hash: { category: "🟠", purpose: "Sitzungs-Authentisierung", legal_basis: "Art. 6(1)(b) DSGVO", retention: "bis expires_at/revoked_at" }
      account_id: { category: "🟠", purpose: "welcher Account", legal_basis: "Art. 6(1)(b) DSGVO", retention: "bis expires_at/revoked_at" }
      acting_profile_id: { category: "🟠", purpose: "handelnde Identität (ADR-013, G-D14)", legal_basis: "Art. 6(1)(b) DSGVO", retention: "bis expires_at/revoked_at" }
      remember_me: { category: "⚙️" }
      expires_at: { category: "⚙️" }
      created_at: { category: "⚙️" }
      revoked_at: { category: "⚙️" }

  household:
    context: identity
    columns:
      id: { category: "⚙️" }
      name: { category: "⚙️" }
      owner_account_id: { category: "🟠", purpose: "Zuordnung, keine Sicherheitsgrenze (C-1.4)", legal_basis: "Art. 6(1)(f) DSGVO", retention: "bis Household-Löschung" }
      contact_email: { category: "🟠", purpose: "Art. 13(1)(a)-Kontaktangabe an Bewerbende", legal_basis: "Art. 6(1)(f) DSGVO", retention: "bis Household-Löschung" }
      created_at: { category: "⚙️" }
      deleted_at: { category: "⚙️" }
      # join_code / join_code_rotated_at left this table 2026-09-21 (join-code-protections, O-18) —
      # see join_code_issuance below, the entity they moved to.

  # --- join-code-protections (O-18, 2026-09-21): domain/identity.md §2.1 "JoinCodeIssuance" ---
  join_code_issuance:
    context: identity
    columns:
      id: { category: "⚙️" }
      household_id: { category: "⚙️", purpose: "RLS-Anker" }
      code: { category: "⚙️", purpose: "identifiziert einen Haushalt, keine Person (G-A5) — TOM-Liste statt Art.-30", legal_basis: "n/a — nicht personenbezogen" }
      expires_at: { category: "⚙️" }
      max_uses: { category: "⚙️" }
      uses: { category: "⚙️" }
      created_at: { category: "⚙️" }
      created_by_account_id: { category: "🟠", purpose: "wer den Link ausgestellt hat", legal_basis: "Art. 6(1)(f) DSGVO", retention: "bis JoinCodeIssuance-Löschung" }
      deleted_at: { category: "⚙️" }
      resident_profile_id: { category: "🟠", purpose: "join-by-link Decision 13 (2026-09-22): benennt die Person, für die ein gebundener Link ausgestellt wurde — anders als jede andere Spalte dieser Tabelle ein Verweis auf eine benannte Person, nicht nur auf den Haushalt", legal_basis: "Art. 6(1)(f) DSGVO", retention: "bis JoinCodeIssuance-Löschung" }
      # Added 2026-09-28 (data-inventory-gate task 2.3): missing since drizzle/0019 introduced the
      # column — the drift ADR-010 warns about, caught by this change's own gate. Classified ⚙️ by
      # human decision 2026-09-28 (ADR-010: the classification is the human's call).
      purpose: { category: "⚙️", purpose: "Art des Links (join / password_reset) — resident-settings Decision 4; personenbezogen erst zusammen mit resident_profile_id, das 🟠 deklariert ist" }

  # --- join-by-link (FR-2.28, 2026-09-22): the join route's attempt limit ---
  join_attempt:
    context: identity
    columns:
      id: { category: "⚙️" }
      source_hash: { category: "🟠", purpose: "pseudonymisierte Quellkennung (HMAC der Client-IP) für die Versuchsbegrenzung auf der Beitrittsroute (FR-2.28/EC-2.14) — die erste Spalte dieser Codebasis über eine Besuchsperson statt ein Mitglied", legal_basis: "Art. 6(1)(f) DSGVO", retention: "24 Stunden, durchgesetzt vom Schreibpfad selbst (record_join_attempt)" }
      attempted_at: { category: "⚙️" }

  household_settings:
    context: identity
    columns:
      household_id: { category: "⚙️" }
      scale_weights: { category: "⚙️" }
      favorite_budget_factor: { category: "⚙️" }
      hide_results_until_voted: { category: "⚙️" }
      quorum_share: { category: "⚙️" }
      updated_at: { category: "⚙️" }
      updated_by_account_id: { category: "🟠", purpose: "Zurechenbarkeit", legal_basis: "Art. 6(1)(f) DSGVO", retention: "bis HouseholdSettings-Löschung" }

  resident_profile:
    context: identity
    columns:
      id: { category: "⚙️" }
      household_id: { category: "⚙️" }
      display_name: { category: "🟠", purpose: "Feed-Beschriftung + Anmeldekennung (O-12)", legal_basis: "Art. 6(1)(b) DSGVO", retention: "bis ResidentProfile-Löschung" }
      status: { category: "⚙️" }
      moved_in_on: { category: "🟠", purpose: "Wohn-Tatsache", legal_basis: "Art. 6(1)(f) DSGVO", retention: "bis ResidentProfile-Löschung" }
      moved_out_on: { category: "🟠", purpose: "Wohn-Tatsache, löst V-3 aus", legal_basis: "Art. 6(1)(f) DSGVO", retention: "bis ResidentProfile-Löschung" }
      room_id: { category: "⚙️" }
      created_at: { category: "⚙️" }

  membership:
    context: identity
    columns:
      id: { category: "⚙️" }
      household_id: { category: "⚙️" }
      account_id: { category: "⚙️" }
      resident_profile_id: { category: "⚙️" }
      is_resident: { category: "⚙️" }
      role: { category: "🟠", purpose: "\"X ist Moderator\" ist eine Aussage über eine identifizierte Person (Art. 4 Nr. 1 DSGVO)", legal_basis: "Art. 6(1)(f) DSGVO", retention: "bis Membership-Löschung; auf Auskunftsverlangen offenzulegen" }
      permissions: { category: "🟠", purpose: "wie role", legal_basis: "Art. 6(1)(f) DSGVO", retention: "bis Membership-Löschung; auf Auskunftsverlangen offenzulegen" }
      joined_via_issuance_id: { category: "⚙️", purpose: "Referenz auf join_code_issuance, nicht der Code selbst (G-A5) — join-code-protections, renamed from joined_via_code" }
      joined_at: { category: "⚙️" }
      revoked_at: { category: "⚙️" }
